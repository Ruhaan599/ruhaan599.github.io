<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss — Ruhaan Gupta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c09">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Newsreader:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0c09; --paper:#f2eedd; --dim:#c6c1a8; --muted:#8f988f; --brass:#d4ab3f; --red:#d0543f; --card:#ebe5cf;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--paper); font-family:'Newsreader', Georgia, serif;
    display:grid; place-items:center; padding:24px 16px; overflow-x:hidden;
    background-image:radial-gradient(700px 700px at 50% 40%, rgba(240,207,115,.12), transparent 70%);
  }
  main{width:100%; max-width:760px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(24px,5vw,56px); align-items:center;}
  svg{width:100%; height:auto; filter:drop-shadow(0 30px 40px rgba(0,0,0,.6)); overflow:visible;}
  .k{font-family:'JetBrains Mono', monospace; font-style:normal; max-width:none; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); margin:0;}
  h1{font-family:'Big Shoulders Display', Impact, sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(5rem, 16vw, 9rem); line-height:.82; margin:.6rem 0 1rem;}
  h1 span{display:block; color:var(--red); margin-top:.08em;}
  p{color:var(--dim); font-style:italic; font-size:1.2rem; margin:0 0 2rem; max-width:26ch;}
  a{
    display:inline-flex; gap:.6rem; align-items:center; padding:1rem 1.5rem; border-radius:999px; background:var(--brass); color:var(--bg);
    font-family:'JetBrains Mono', monospace; font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
    transition:background-color .25s;
  }
  a:hover{background:var(--paper);}
  a:focus-visible{outline:2px solid var(--paper); outline-offset:3px;}
  .shot{animation:land .5s cubic-bezier(.2,.7,.1,1) .4s both;}
  @keyframes land{from{opacity:0; transform:scale(3);}to{opacity:1; transform:none;}}
  @media (max-width:620px){ main{grid-template-columns:1fr; text-align:center;} svg{max-width:300px; margin:0 auto;} p{margin-left:auto; margin-right:auto;} }
  @media (prefers-reduced-motion: reduce){ .shot{animation:none;} }
</style>
</head>
<body>
<main>
  <svg viewBox="-92 -92 184 184" aria-hidden="true">
    <rect x="-85" y="-85" width="170" height="170" rx="1.2" fill="#ebe5cf"/>
    <g fill="none" stroke="#1a1a16" stroke-width=".35">
      <circle r="77.75"/><circle r="69.75"/><circle r="61.75"/><circle r="53.75"/><circle r="45.75"/><circle r="37.75"/>
    </g>
    <circle r="29.75" fill="#131311"/>
    <g fill="none" stroke="#ebe5cf" stroke-width=".3"><circle r="21.75"/><circle r="13.75"/><circle r="5.75"/><circle r="2.5"/></g>
    <g class="shot" style="transform-origin:96px -78px">
      <circle cx="96" cy="-78" r="2.6" fill="#d0543f" stroke="#fff" stroke-width=".6"/>
      <circle cx="96" cy="-78" r="7" fill="none" stroke="#d0543f" stroke-width=".5" stroke-dasharray="1.5 1.5"/>
    </g>
  </svg>
  <div>
    <p class="k">Error 404 &middot; Lane closed</p>
    <h1>0.0<span>Miss</span></h1>
    <p>That page is off the paper. Reload, reset, and take the next one.</p>
    <a href="/">Back to the line &rarr;</a>
  </div>
</main>
</body>
</html>
